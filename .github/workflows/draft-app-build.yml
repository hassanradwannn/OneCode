name: Build verified app assets for an existing draft

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact 40 character source commit SHA
        required: true
        type: string
      release_tag:
        description: Existing draft tag (beta-vX.Y.Z or vX.Y.Z)
        required: true
        type: string
      operation:
        description: App release operation
        required: true
        type: choice
        options:
          - beta-full
          - beta-capsule
          - beta-release
          - beta-full-backfill
          - stable-full
          - stable-capsule
          - stable-release
          - stable-full-backfill
      base_version:
        description: Required published compatible base version for capsule operations
        required: false
        type: string
      platform:
        description: Platform to build (select one when retrying a runner)
        required: false
        default: all
        type: choice
        options:
          - all
          - win32
          - linux

permissions:
  contents: read

jobs:
  build-and-upload:
    name: ${{ matrix.platform }} x64 app release assets
    if: inputs.operation == 'beta-full' || inputs.operation == 'beta-capsule' || inputs.operation == 'beta-release' || inputs.operation == 'beta-full-backfill' || inputs.operation == 'stable-full' || inputs.operation == 'stable-capsule' || inputs.operation == 'stable-release' || inputs.operation == 'stable-full-backfill'
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platform == 'win32' && '["win32"]' || inputs.platform == 'linux' && '["linux"]' || '["win32","linux"]') }}
    runs-on: ${{ matrix.platform == 'win32' && 'windows-2025' || 'ubuntu-22.04' }}
    timeout-minutes: 150
    permissions:
      contents: write
    env:
      SOURCE_REF: ${{ inputs.source_ref }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      BUILD_OPERATION: ${{ inputs.operation }}
      BASE_VERSION: ${{ inputs.base_version }}
      BUILD_PLATFORM: ${{ matrix.platform }}

    steps:
      - name: Check out workflow tools
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          path: workflow-source
          persist-credentials: false

      - name: Check out exact app source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.source_ref }}
          path: app-source
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24.22.0
          package-manager-cache: false
          cache: npm
          cache-dependency-path: app-source/package-lock.json

      - name: Verify source ref and existing draft before build
        env:
          GH_TOKEN: ${{ github.token }}
          APP_SOURCE_DIR: app-source
        run: node workflow-source/scripts/draft-app-release.mjs verify

      - name: Install locked dependencies
        working-directory: app-source
        run: npm ci

      - name: Install declared Linux speech runtime prerequisites
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libblas3 liblapack3 pulseaudio-utils
          /usr/bin/python3 --version

      - name: Verify public source, types, notices and production bundles
        working-directory: app-source
        run: npm run verify

      - name: Package Beta full release
        if: inputs.operation == 'beta-full'
        working-directory: app-source
        shell: bash
        run: |
          if [[ "$BUILD_PLATFORM" == win32 ]]; then
            export PATH="$(cygpath -u "$WINDIR")/System32:$PATH"
            tar.exe --version
          fi
          GOMAXPROCS=2 NODE_OPTIONS=--max-old-space-size=4096 node scripts/package.mjs --channel beta --platform "$BUILD_PLATFORM" --arch x64
          if [[ "$BUILD_PLATFORM" == win32 ]]; then
            node scripts/prepare-windows-release.mjs release-beta --full-only
          else
            node scripts/prepare-linux-release.mjs release-beta --full-only
          fi

      - name: Package Beta compatibility capsule
        if: inputs.operation == 'beta-capsule'
        working-directory: app-source
        shell: bash
        run: |
          if [[ "$BUILD_PLATFORM" == win32 ]]; then
            export PATH="$(cygpath -u "$WINDIR")/System32:$PATH"
            tar.exe --version
          fi
          GOMAXPROCS=2 NODE_OPTIONS=--max-old-space-size=4096 node scripts/package.mjs --channel beta --platform "$BUILD_PLATFORM" --arch x64 --dir
          if [[ "$BUILD_PLATFORM" == win32 ]]; then
            node scripts/write-hotfix-package.mjs release-beta --base-version "$BASE_VERSION"
          else
            node scripts/write-linux-hotfix-package.mjs release-beta --base-version "$BASE_VERSION"
          fi

      - name: Package complete Beta release with backward-compatible capsule
        if: inputs.operation == 'beta-release'
        working-directory: app-source
        shell: bash
        run: |
          if [[ "$BUILD_PLATFORM" == win32 ]]; then
            export PATH="$(cygpath -u "$WINDIR")/System32:$PATH"
            tar.exe --version
          fi
          GOMAXPROCS=2 NODE_OPTIONS=--max-old-space-size=4096 node scripts/package.mjs --channel beta --platform "$BUILD_PLATFORM" --arch x64
          if [[ "$BUILD_PLATFORM" == win32 ]]; then
            node scripts/prepare-windows-release.mjs release-beta --full-only
            cp release-beta/SHA256SUMS.txt .beta-full-checksums.txt
            node scripts/write-hotfix-package.mjs release-beta --base-version "$BASE_VERSION"
          else
            node scripts/prepare-linux-release.mjs release-beta --full-only
            cp release-beta/SHA256SUMS.txt .beta-full-checksums.txt
            node scripts/write-linux-hotfix-package.mjs release-beta --base-version "$BASE_VERSION"
          fi
          node ../workflow-source/scripts/merge-release-checksums.mjs .beta-full-checksums.txt release-beta/SHA256SUMS.txt release-beta/SHA256SUMS.txt
          rm -f .beta-full-checksums.txt

      - name: Backfill complete Beta artifacts on an existing prerelease
        if: inputs.operation == 'beta-full-backfill'
        working-directory: app-source
        shell: bash
        run: |
          if [[ "$BUILD_PLATFORM" == win32 ]]; then
            export PATH="$(cygpath -u "$WINDIR")/System32:$PATH"
            tar.exe --version
          fi
          GOMAXPROCS=2 NODE_OPTIONS=--max-old-space-size=4096 node scripts/package.mjs --channel beta --platform "$BUILD_PLATFORM" --arch x64
          if [[ "$BUILD_PLATFORM" == win32 ]]; then
            node scripts/prepare-windows-release.mjs release-beta --full-only
          else
            node scripts/prepare-linux-release.mjs release-beta --full-only
          fi

      - name: Package stable full release
        if: inputs.operation == 'stable-full'
        working-directory: app-source
        shell: bash
        run: |
          if [[ "$BUILD_PLATFORM" == win32 ]]; then
            export PATH="$(cygpath -u "$WINDIR")/System32:$PATH"
            tar.exe --version
          fi
          GOMAXPROCS=2 NODE_OPTIONS=--max-old-space-size=4096 node scripts/package.mjs --channel stable --platform "$BUILD_PLATFORM" --arch x64
          if [[ "$BUILD_PLATFORM" == win32 ]]; then
            node scripts/prepare-windows-release.mjs release
          else
            node scripts/prepare-linux-release.mjs release
          fi

      - name: Package stable compatibility capsule
        if: inputs.operation == 'stable-capsule'
        working-directory: app-source
        shell: bash
        run: |
          if [[ "$BUILD_PLATFORM" == win32 ]]; then
            export PATH="$(cygpath -u "$WINDIR")/System32:$PATH"
            tar.exe --version
          fi
          GOMAXPROCS=2 NODE_OPTIONS=--max-old-space-size=4096 node scripts/package.mjs --channel stable --platform "$BUILD_PLATFORM" --arch x64 --dir
          if [[ "$BUILD_PLATFORM" == win32 ]]; then
            node scripts/write-hotfix-package.mjs release --base-version "$BASE_VERSION"
          else
            node scripts/write-linux-hotfix-package.mjs release --base-version "$BASE_VERSION"
          fi

      - name: Package complete stable release with backward-compatible capsule
        if: inputs.operation == 'stable-release'
        working-directory: app-source
        shell: bash
        run: |
          if [[ "$BUILD_PLATFORM" == win32 ]]; then
            export PATH="$(cygpath -u "$WINDIR")/System32:$PATH"
            tar.exe --version
          fi
          GOMAXPROCS=2 NODE_OPTIONS=--max-old-space-size=4096 node scripts/package.mjs --channel stable --platform "$BUILD_PLATFORM" --arch x64
          if [[ "$BUILD_PLATFORM" == win32 ]]; then
            node scripts/prepare-windows-release.mjs release --full-only
            cp release/SHA256SUMS.txt .stable-full-checksums.txt
            node scripts/write-hotfix-package.mjs release --base-version "$BASE_VERSION"
          else
            node scripts/prepare-linux-release.mjs release --full-only
            cp release/SHA256SUMS.txt .stable-full-checksums.txt
            node scripts/write-linux-hotfix-package.mjs release --base-version "$BASE_VERSION"
          fi
          node ../workflow-source/scripts/merge-release-checksums.mjs .stable-full-checksums.txt release/SHA256SUMS.txt release/SHA256SUMS.txt
          rm -f .stable-full-checksums.txt

      - name: Backfill complete stable artifacts on an existing release
        if: inputs.operation == 'stable-full-backfill'
        working-directory: app-source
        shell: bash
        run: |
          if [[ "$BUILD_PLATFORM" == win32 ]]; then
            export PATH="$(cygpath -u "$WINDIR")/System32:$PATH"
            tar.exe --version
          fi
          GOMAXPROCS=2 NODE_OPTIONS=--max-old-space-size=4096 node scripts/package.mjs --channel stable --platform "$BUILD_PLATFORM" --arch x64
          if [[ "$BUILD_PLATFORM" == win32 ]]; then
            node scripts/prepare-windows-release.mjs release --full-only
          else
            node scripts/prepare-linux-release.mjs release --full-only
          fi

      - name: Run packaged runtime smoke
        working-directory: app-source
        shell: bash
        run: |
          if [[ "$BUILD_OPERATION" == stable-full || "$BUILD_OPERATION" == stable-capsule || "$BUILD_OPERATION" == stable-release || "$BUILD_OPERATION" == stable-full-backfill ]]; then
            ONECODE_BUILD_CHANNEL=stable ONECODE_PACKAGE_OUTPUT=release node scripts/smoke-packaged-runtime.mjs --platform "$BUILD_PLATFORM" --arch x64
          else
            ONECODE_BUILD_CHANNEL=beta ONECODE_PACKAGE_OUTPUT=release-beta node scripts/smoke-packaged-runtime.mjs --platform "$BUILD_PLATFORM" --arch x64
          fi

      - name: Validate and stage checksum-listed payloads
        env:
          APP_SOURCE_DIR: app-source
        run: node workflow-source/scripts/draft-app-release.mjs stage

      - name: Recheck draft and upload curated assets
        env:
          GH_TOKEN: ${{ github.token }}
          APP_SOURCE_DIR: app-source
        run: node workflow-source/scripts/draft-app-release.mjs upload

  finalize-release-checksums:
    name: finalize canonical release checksum register
    needs: build-and-upload
    if: needs.build-and-upload.result == 'success' && inputs.operation != 'beta-full-backfill' && inputs.operation != 'stable-full-backfill'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      SOURCE_REF: ${{ inputs.source_ref }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      BUILD_OPERATION: ${{ inputs.operation }}
      BASE_VERSION: ${{ inputs.base_version }}

    steps:
      - name: Check out workflow tools
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          path: workflow-source
          persist-credentials: false

      - name: Check out exact app source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.source_ref }}
          path: app-source
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24.22.0
          package-manager-cache: false

      - name: Recheck exact draft and source before checksum finalization
        env:
          GH_TOKEN: ${{ github.token }}
          APP_SOURCE_DIR: app-source
          BUILD_PLATFORM: win32
        run: node workflow-source/scripts/draft-app-release.mjs verify

      - name: Merge platform registers and publish canonical checksum
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          rm -rf checksum-finalize
          mkdir checksum-finalize
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir checksum-finalize \
            --pattern 'SHA256SUMS-win32-x64.txt' --pattern 'SHA256SUMS-linux-x64.txt'
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets > checksum-finalize/assets.json
          node workflow-source/scripts/merge-platform-release-checksums.mjs checksum-finalize
          existing="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | select(.name == "SHA256SUMS.txt") | .name')"
          if [[ -z "$existing" ]]; then
            gh release upload "$RELEASE_TAG" checksum-finalize/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY"
          else
            echo "Canonical SHA256SUMS.txt already exists and matched the verified register."
          fi
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets > checksum-finalize/assets-after.json
          node workflow-source/scripts/merge-platform-release-checksums.mjs checksum-finalize assets-after.json
